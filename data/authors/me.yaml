experience:
  - role: Quantitative Researcher in Energy Markets and Algorithmic Trading
    org: Aros Commodities & Aarhus University, Denmark
    start: 2026-01-01
    end: present
    summary: |
      * **Developed stochastic models of high-frequency intraday electricity prices** for optimal liquidation.
      * **Modeled market microstructure and auction effects** using Hawkes processes and empirically calibrated jump distributions, including auction-related price drops and recovery.
      * **Built memory-efficient Python tools** for large-scale quote analysis, maximum-likelihood estimation, and out-of-sample evaluation.
      * **Developed stochastic-control methods using Hamilton–Jacobi–Bellman equations** to study liquidation under price uncertainty and execution costs.
  - role: PhD Researcher in Mathematics
    org: Aarhus University
    start: 2022-11-01
    end: 2025-12-15
    summary: |
      * **Developed stochastic models and established limit theorems** describing the distributional and asymptotic behavior of dynamic networks and higher-order interactions.
      * **Designed statistical tests** to evaluate model assumptions and predictions against empirical network data.
      * **Built high-performance Monte Carlo simulations in Python and C++** to investigate finite-sample behavior, validate theoretical results, and quantify uncertainty.
      * **Presented research at international conferences** in probability, stochastic modeling, and data analysis.
      * **Taught advanced probability, data analysis, and differential equations** to mathematics and data-science students.
  - role: Machine Learning Researcher & Software Architect in Automated Driving
    org: Bosch Group Hungary
    start: 2018-05-15
    end: 2022-10-31
    summary: |
      * **Patented a Gaussian regression-based trajectory prediction model**, improving predictive accuracy by 3× and uncertainty calibration by 10× over production baselines.
      * **Built stochastic forecasting and uncertainty quantification models in Python** for safety-critical, real-time decision-making in automated driving.
      * **Translated Python prototypes into scalable C++ systems** with explicit reliability criteria.
      * **Analyzed more than 20,000 hours of driving data** and designed large-scale validation experiments to evaluate model assumptions, predictive accuracy, and uncertainty calibration.
      * **Led a team of 11** developing, validating, and integrating environment prediction models for automated driving as a technical lead.
      * **Oversaw 2 teams** in the integration of driver monitoring systems.
  - role: Software Engineer in Performance Analytics
    org: Ericsson Telecommunications Hungary
    start: 2016-03-01
    end: 2018-05-14
    summary: |
      * **Optimized load-balancing strategies** by analyzing performance and response-time distributions of large-scale distributed systems.
      * **Designed and implemented performance-critical algorithms** for high-throughput network routing systems.
      * **Coordinated a team of 8** as a deputy of the product owner.

