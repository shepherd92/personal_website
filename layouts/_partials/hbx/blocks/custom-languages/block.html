{{ $profile := partial "functions/get_author_profile" .wcBlock.content.username }}
<div class="mx-auto w-full max-w-4xl px-4 sm:px-6 lg:px-8">
  <h2 class="mb-8 text-3xl font-bold text-center">{{ .wcBlock.content.title }}</h2>
  <dl class="grid grid-cols-1 sm:grid-cols-3 gap-6 text-center">
    {{ range $profile.languages }}
    <div class="rounded-xl border border-gray-200 dark:border-gray-700 p-6">
      <dt class="text-lg font-semibold">{{ .name }}</dt>
      <dd class="mt-2 text-gray-600 dark:text-gray-300">{{ .label }}</dd>
    </div>
    {{ end }}
  </dl>
</div>
